labels:
  - toxic
  - severe_toxic
  - obscene
  - threat
  - insult
  - identity_hate

data:
  raw_path: data/01-raw/train.csv
  preprocessed_path: data/02-preprocessed/train_clean.csv
  features_dir: data/03-features
  predictions_dir: data/04-predictions

split:
  test_size: 0.2
  random_state: 42

model:
  max_features: 50000
  ngram_range: [1, 2]
  C: 4.0
  solver: liblinear
  max_iter: 1000

mlflow:
  tracking_uri: http://localhost:5000
  experiment_name: toxic-clf
  registered_model_name: toxic-clf
