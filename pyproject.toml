[tool.poetry]
name = "mlops-toxic"
version = "0.1.0"
description = "End-to-end toxic comment detection with a continuous deployment pipeline"
authors = ["Burak Gündüs"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pandas = "^2.2"
scikit-learn = "^1.5"
mlflow = "^2.13"
fastapi = "^0.111"
uvicorn = "^0.30"
pydantic = "^2.7"
dvc = "^3.67.1"
great-expectations = "^1.24.0"
optuna = "^5.0.0"
pyyaml = "^6.0.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-cov = "^5.0"
ruff = "^0.5"
mypy = "^1.10"
pre-commit = "^3.7"
types-pyyaml = "^6.0.12.20260906"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100

[tool.mypy]
ignore_missing_imports = true